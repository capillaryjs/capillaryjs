name: Bug report
description: Report a reproducible Capillary or CapillaryUi defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; follow SECURITY.md.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@capillaryjs/capillary"
        - "@capillaryjs/capillary-ui"
        - Repository tooling
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction and observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Runtime, browser, and operating system
    validations:
      required: true
