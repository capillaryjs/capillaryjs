name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install pinned browser engines
        run: corepack pnpm exec playwright install --with-deps

      - name: Run workspace verification
        run: corepack pnpm verify

      - name: Run release preflight
        run: corepack pnpm verify:release

      - name: Retain failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
