name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install pinned browser engines
        run: corepack pnpm exec playwright install --with-deps

      - name: Exercise Gradle normal verification entry point
        run: ./gradlew publicCheck

      - name: Exercise Gradle release entry point
        run: ./gradlew publicReleasePreflight
