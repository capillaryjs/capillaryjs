name: Stage npm release
run-name: Stage npm ${{ inputs.release_id }} @ ${{ github.sha }} / ${{ inputs.plan_digest }}

on:
  workflow_dispatch:
    inputs:
      release_plan:
        description: Canonical JSON release plan with package keys, exact versions, tags, and date
        required: true
        type: string
      release_id:
        description: Desktop release run identity (optional for legacy recovery)
        required: false
        type: string
      candidate_sha:
        description: Exact approved candidate (optional for legacy recovery)
        required: false
        type: string
      plan_digest:
        description: SHA-256 of the exact release plan input
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-stage-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out public main
        uses: actions/checkout@v6

      - name: Check approved candidate and plan identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          RELEASE_PLAN: ${{ inputs.release_plan }}
        run: |
          test -z "$CANDIDATE_SHA" || test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --input-type=module -e 'import {createHash} from "node:crypto"; if (process.env.PLAN_DIGEST && createHash("sha256").update(process.env.RELEASE_PLAN).digest("hex") !== process.env.PLAN_DIGEST) process.exit(1)'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install pinned browser engines
        run: corepack pnpm exec playwright install --with-deps

      - name: Verify source and deterministic release artifacts
        run: corepack pnpm verify:release

      - name: Validate release plan and registry availability
        env:
          RELEASE_PLAN: ${{ inputs.release_plan }}
        run: >-
          corepack pnpm release:validate
          --release-plan "$RELEASE_PLAN"

      - name: Retain the exact reviewed tarballs
        uses: actions/upload-artifact@v6
        with:
          name: npm-release-${{ github.run_id }}
          path: |
            .artifacts/release/package-artifacts.json
            .artifacts/release/packages/*.tgz
          if-no-files-found: error
          retention-days: 14

  stage:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v6

      - name: Set up Node and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install staged-publishing npm CLI
        run: npm install --global npm@11.19.1

      - name: Download exact verified tarballs
        uses: actions/download-artifact@v7
        with:
          name: npm-release-${{ github.run_id }}
          path: .artifacts/release

      - name: Show and stage release plan
        env:
          RELEASE_PLAN: ${{ inputs.release_plan }}
        run: >-
          node scripts/stage-release.mjs stage
          --release-plan "$RELEASE_PLAN"
          --recover-existing

      - name: Record human promotion instructions
        run: |
          {
            echo '## Packages staged for review'
            echo
            echo 'CI did not publish or approve a package.'
            echo 'Use npmjs.com Staged Packages, or npm stage list/view/download, to inspect it.'
            echo 'A maintainer must approve each stage with 2FA. Approve dependencies before dependants: Capillary, then CapillaryUi, then CapillaryUi Visualization.'
          } >> "$GITHUB_STEP_SUMMARY"
