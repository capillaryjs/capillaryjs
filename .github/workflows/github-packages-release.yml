name: Mirror verified packages to GitHub Packages
run-name: Mirror npm ${{ inputs.workflow_run_id }} @ ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Verified public commit containing the release artifacts
        required: true
        type: string
      workflow_run_id:
        description: Successful staging workflow whose retained artifacts are being mirrored
        required: true
        type: string
      release_plan:
        description: Exact approved package versions to mirror
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: github-packages-release-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Set up Node and GitHub Packages registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false

      - name: Download exact verified tarballs
        uses: actions/download-artifact@v7
        with:
          name: npm-release-${{ inputs.workflow_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: capillaryjs/capillaryjs
          run-id: ${{ inputs.workflow_run_id }}
          path: .artifacts/release

      - name: Publish or verify packages in GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PLAN: ${{ inputs.release_plan }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto'
          import {mkdirSync, mkdtempSync, readFileSync, readdirSync, rmSync, statSync} from 'node:fs'
          import {tmpdir} from 'node:os'
          import {join} from 'node:path'
          import {spawnSync} from 'node:child_process'
          import {parseReleasePlan} from './scripts/release-metadata.mjs'

          const registry = 'https://npm.pkg.github.com'
          const root = '.artifacts/release'
          const report = JSON.parse(readFileSync(join(root, 'package-artifacts.json'), 'utf8'))
          const plan = parseReleasePlan(process.env.RELEASE_PLAN)
          const selected = plan.packages.map(({name, version}) => {
              const matches = report.packages.filter((entry) => entry.name === name && entry.version === version)
              if (matches.length !== 1) throw new Error(`Missing or ambiguous approved artifact: ${name}@${version}`)
              return matches[0]
          })
          const downloads = mkdtempSync(join(tmpdir(), 'capillaryjs-github-packages-'))

          try {
              for (const entry of selected) {
                  const tarball = join(root, 'packages', entry.filename)
                  const identity = `${entry.name}@${entry.version}`
                  const view = npm(['view', identity, 'dist.tarball', '--json', `--registry=${registry}`])
                  if (view.status !== 0) {
                      if (!`${view.stdout}\n${view.stderr}`.includes('E404')) throw commandError('inspect', identity, view)
                      console.log(`[github-packages] publishing absent ${identity}`)
                      const publish = npm(['publish', tarball, `--registry=${registry}`, '--access', 'public', '--ignore-scripts'])
                      if (publish.status !== 0) throw commandError('publish', identity, publish)
                  }

                  const packageDirectory = join(downloads, entry.filename)
                  mkdirSync(packageDirectory)
                  const packed = npm(['pack', identity, '--json', `--registry=${registry}`, '--ignore-scripts', '--pack-destination', packageDirectory])
                  if (packed.status !== 0) throw commandError('download existing', identity, packed)
                  const existing = readdirSync(packageDirectory)
                  if (existing.length !== 1) throw new Error(`[github-packages] expected one downloaded tarball for ${identity}, found ${existing.length}`)
                  const filename = join(packageDirectory, existing[0])
                  const sha256 = createHash('sha256').update(readFileSync(filename)).digest('hex')
                  const bytes = statSync(filename).size
                  if (sha256 !== entry.sha256 || bytes !== entry.bytes) {
                      throw new Error(`[github-packages] existing ${identity} differs from the verified workflow artifact`)
                  }
                  console.log(`[github-packages] existing ${identity} matches verified artifact; skipping publish`)
              }
          } finally {
              rmSync(downloads, {recursive: true, force: true})
          }

          function npm(args) {
              return spawnSync('npm', args, {encoding: 'utf8', env: process.env})
          }

          function commandError(action, identity, result) {
              return new Error(`[github-packages] could not ${action} ${identity}: ${(result.stderr || result.stdout).trim()}`)
          }
          NODE
